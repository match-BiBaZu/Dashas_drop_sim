[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dashas-drop-sim"
version = "0.5.0"
description = "Reproducible rigid-body drop tests for parts in the BiBaZu L chute"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coacd==1.0.14",
    "mujoco==3.14.0",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "scipy>=1.11,<2",
    "trimesh>=4,<6",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.7,<7"]
step = ["cadquery-ocp>=7.8,<8"]
geometry = ["bibazu-chute-pose"]
dev = ["pytest>=8,<10"]

[project.scripts]
dashas-drop-sim = "dashas_drop_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dashas_drop_sim"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
bibazu-chute-pose = { path = "vendor/bibazu_chute_pose" }
